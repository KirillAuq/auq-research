<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUQ Research</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:#fafafa;color:#111;padding:80px 24px;max-width:980px;margin:0 auto}
.ey{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;color:#6B7280;text-transform:uppercase}
h1{font-size:48px;font-weight:600;letter-spacing:-.02em;margin:12px 0 8px}
.sub{color:#6B7280;font-size:17px;margin-bottom:48px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{display:block;text-decoration:none;color:inherit;border:1px solid #E5E7EB;border-radius:14px;padding:24px;background:#fff;transition:.15s}
.card:hover{border-color:#2563EB;box-shadow:0 6px 24px rgba(37,99,235,.08);transform:translateY(-2px)}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#2563EB;margin-bottom:10px}
.b{font-size:22px;font-weight:600;line-height:1.25}
.desc{color:#6B7280;font-size:15px;line-height:1.5;margin:8px 0 16px}
.more{font-family:'JetBrains Mono',monospace;font-size:13px;color:#2563EB}
.empty{grid-column:1/-1;color:#9CA3AF;font-size:15px;border:1px dashed #E5E7EB;border-radius:14px;padding:40px;text-align:center}
footer{margin-top:56px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#9CA3AF;letter-spacing:.08em}
@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:48px 16px}h1{font-size:34px}}
</style></head><body>
<div class="ey">RESEARCH &middot; SEO &amp; GEO</div>
<h1>AUQ Research</h1>
<p class="sub">Original research and data on SEO, GEO, and AI search for B2B SaaS.</p>
<div class="grid">
<!-- ============================================================
     CARD TEMPLATE — copy one block per research piece (newest first).
     Replace the href with your uploaded file name, and fill the fields.
     Delete the .empty placeholder below once you add your first card.

<a class="card" href="your-file-name.html">
  <div class="tag">CATEGORY</div>
  <div class="b">Title of the research piece</div>
  <div class="desc">One-line summary of what it covers and why it matters.</div>
  <div class="more">Read &rarr;</div>
</a>
     ============================================================ -->
<div class="empty">Research pieces will appear here. Add a card using the template in this file when you upload content.</div>
</div>
<footer>PREPARED BY AUQ &middot; ANALYTICS@AUQ.IO</footer>
</body></html>
